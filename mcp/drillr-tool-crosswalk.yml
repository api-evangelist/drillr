note: >-
  The MCP tools and the REST endpoints are overlapping-but-non-identical
  projections of one data core. Seven MCP tools bind cleanly to a dedicated REST
  operation. The three data tools (run_sql, get_table_schema, list_tables) have no
  dedicated REST operation — they expose arbitrary SELECT over the underlying
  tables (including alt-data tables the REST API does not surface at all). Most
  REST endpoints (financial statements, prices, ownership, analyst, executives)
  have no dedicated MCP tool but are reachable through run_sql against the matching
  table, so they are recorded as rest_only with that note rather than as gaps.
