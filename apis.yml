name: drillr Public Data API
description: >-
  drillr is a financial data and research API for the US, China and Japan. It provides financial statements, full-text
  filing search, natural-language company discovery, and research signals extracted from filings, news and earnings
  calls. The same data is served two ways: a REST API for scripts and pipelines, and a hosted MCP server for AI agents,
  with every reported figure linking back to its source document.
