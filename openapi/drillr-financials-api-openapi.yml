  /api/v2/financial-metrics-snapshot:
    get:
      operationId: publicDataV2FinancialMetricsSnapshot
      tags:
      - Financials
      summary: Get current financial metrics
      description: 'Returns a company''s precomputed valuation and financial ratios: market cap, enterprise value, TTM valuation multiples, margins, returns, growth rates, leverage and liquidity ratios, and dividend metrics, one row per ticker as of the latest snapshot date. Ratios are always decimals (`0.25` = 25%), not percentages; monetary fields are in `currency` (the trading currency), and `market_capitalization_usd` is additionally converted to USD at the snapshot-date rate.


        Example request: `GET /api/v2/financial-metrics-snapshot?ticker=AAPL`'
      security:
      - ApiKeyAuth: []
      x-credits: 0.02 cr per call
      x-refresh: weekdays at 16:00 UTC
      parameters:
      - name: ticker
        in: query
        required: true
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 50
      responses:
        '200':
          description: Successful Public Data API response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicFinancialMetricsSnapshotItem'
                required:
                - data
                additionalProperties: false
              example:
                data:
                - ticker: AAPL
                  market: US
                  currency: USD
                  shares_outstanding: 14780000000
                  market_capitalization: 3421000000000
