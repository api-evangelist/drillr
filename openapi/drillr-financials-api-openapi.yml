  /api/v2/balance-sheets:
    get:
      operationId: publicDataV2BalanceSheets
      tags:
      - Financials
      summary: Get balance sheets
      description: 'Returns a company''s balance sheet: assets, liabilities, shareholders'' equity and their line items, one row per reporting period as of period end. 41 line-item columns in total, plus the 14 meta-data fields shared by the three statements, all listed under Response fields; `period_start` is always `null`. `total_debt` / `net_debt` are derived columns (not as-reported lines); all other columns are as-reported values.


        Example request: `GET /api/v2/balance-sheets?ticker=AAPL&period=FY&limit=3`'
      security:
      - ApiKeyAuth: []
      x-credits: 0.02 cr per call
      x-refresh: follows filing ingestion; canonical replay weekly
      parameters:
      - name: ticker
        in: query
        required: true
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 10
      - name: period
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - FY
            - Q1
            - Q2
            - Q3
            - Q4
          minItems: 1
          default:
          - FY
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 40
          default: 4
      responses:
        '200':
          description: Successful Public Data API response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicBalanceSheetsItem'
                required:
                - data
                additionalProperties: false
