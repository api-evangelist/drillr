openapi: 3.2.0
info:
  title: drillr Public Data Financials API
  version: 2.0.0-spec.110
  description: 'REST endpoints over the same tables the drillr app runs on: fundamentals, filings, earnings, ownership, events, executives, analyst data and news for US, Japan and China equities.'
  termsOfService: https://drillr.ai/legal/terms
  contact:
    name: drillr developer support
    url: https://drillr.ai/docs
    email: support@lil-grebe.com
  license:
    name: drillr Terms of Service
    url: https://drillr.ai/legal/terms
  x-logo:
    url: https://drillr.ai/images/brand/logo_512_optimized.png
    altText: drillr
servers:
- url: https://gateway.drillr.ai
security:
- ApiKeyAuth: []
tags:
- name: Financials
  description: The three financial statements and precomputed financial metrics
paths:
  /api/v2/income-statements:
    get:
      operationId: publicDataV2IncomeStatements
      tags:
      - Financials
      summary: Get income statements
      description: 'Returns a company''s income statement: revenue, costs, profit at each level, earnings per share and more, one row per reporting period. 29 line-item columns in total, plus the 14 meta-data fields shared by the three statements, all listed under Response fields. `ebitda` is a derived column (not an as-reported line). Quarterly amounts may be calculated from cumulative disclosures; earnings per share and weighted average shares cannot be obtained by directly subtracting cumulative figures.


        Example request: `GET /api/v2/income-statements?ticker=AAPL&period=FY&limit=5`'
      security:
      - ApiKeyAuth: []
      x-credits: 0.02 cr per call
      x-refresh: follows filing ingestion; canonical replay weekly
      parameters:
      - name: ticker
        in: query
        required: true
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 10
      - name: period
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - FY
            - Q1
            - Q2
            - Q3
            - Q4
          minItems: 1
          default:
          - FY
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 40
          default: 4
      responses:
        '200':
          description: Successful Public Data API response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicIncomeStatementsItem'
                required:
                - data
                additionalProperties: false
              example:
                data:
                - ticker: AAPL
                  market: US
                  fiscal_year: 2025
                  period: FY
                  period_start: '2024-09-29'
                  report_period: '2025-09-27'
                  currency: USD
                  accounting_standard: US-GAAP
                  accession_number: 0000320193-25-000079
                  form_type: 10-K
                  filing_url: https://www.sec.gov/Archives/edgar/data/320193/000032019325000079/0000320193-25-000079.txt
                  filing_date: '2025-10-31'
                  derived_fields: []
