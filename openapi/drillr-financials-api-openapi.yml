  /api/v2/cash-flow-statements:
    get:
      operationId: publicDataV2CashFlowStatements
      tags:
      - Financials
      summary: Get cash-flow statements
      description: 'Returns a company''s cash flow statement: operating, investing and financing cash flows plus free cash flow, one row per reporting period. 16 line-item columns in total, plus the 14 meta-data fields shared by the three statements, all listed under Response fields. Signs follow the statement direction: outflows such as capital expenditures, buybacks and dividends are negative, inflows such as investment proceeds are positive. `free_cash_flow` is a derived column (not an as-reported line). Quarterly cash flows may be calculated from cumulative disclosures; half-year or full-year cumulative amounts are not returned as single-quarter amounts.


        Example request: `GET /api/v2/cash-flow-statements?ticker=AAPL&period=FY&limit=3`'
      security:
      - ApiKeyAuth: []
      x-credits: 0.02 cr per call
      x-refresh: follows filing ingestion; canonical replay weekly
      parameters:
      - name: ticker
        in: query
        required: true
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 10
      - name: period
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - FY
            - Q1
            - Q2
            - Q3
            - Q4
          minItems: 1
          default:
          - FY
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 40
          default: 4
      responses:
        '200':
          description: Successful Public Data API response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicCashFlowStatementsItem'
                required:
                - data
                additionalProperties: false
              example:
                data:
                - ticker: AAPL
                  market: US
                  fiscal_year: 2025
