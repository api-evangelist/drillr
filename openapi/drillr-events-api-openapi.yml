  /api/v2/events-corporate-actions:
    get:
      operationId: publicDataV2EventsCorporateActions
      tags:
      - Events
      summary: Get corporate-action events
      description: 'Returns the dividends, buybacks, capital reductions, splits and reverse splits, stock dividends and bonus issues, and share class changes a company has announced, one row per disclosure (`event_class = distribution` or `share_structure`). It records what the company announced and is not a source of adjustment factors: no rights-issue / spin-off ex-date adjustment parameters are provided, and `/prices-historical` returns unadjusted prices.


        Example request: `GET /api/v2/events-corporate-actions?ticker=AVGO&event_type=dividend&from=2026-09-01&to=2026-09-30`'
      security:
      - ApiKeyAuth: []
      x-credits: 0.02 cr per call
      x-refresh: intraday extraction plus Sunday 09:00 UTC canonical replay
      parameters:
      - name: ticker
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 10
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: event_class
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - distribution
            - share_structure
          minItems: 1
      - name: event_type
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - dividend
            - buyback
            - capital_reduction
            - stock_split
            - reverse_split
            - bonus_issue
            - share_class_change
          minItems: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      responses:
