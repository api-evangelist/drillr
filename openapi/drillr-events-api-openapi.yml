  /api/v2/events-ownership:
    get:
      operationId: publicDataV2EventsOwnership
      tags:
      - Events
      summary: Get ownership events
      description: 'Returns major shareholder positions disclosed in SEC Schedule 13D/G filings. Each row represents one reporting person and security position in a filing, with the currently reported ownership, its change from the preceding filing when calculable, and a link to the official document; a joint filing can return multiple rows. Only the latest row for each company + shareholder + security sequence is returned. `event_class` is fixed at `ownership` and `event_type` at `stake_change`. For routine insider trades, use `/insider-trades`.


        Example request: `GET /api/v2/events-ownership?ticker=PLTR&from=2026-03-01&to=2026-03-31`'
      security:
      - ApiKeyAuth: []
      x-credits: 0.02 cr per call
      x-refresh: intraday extraction plus Sunday 09:00 UTC canonical replay
      parameters:
      - name: ticker
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 10
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      responses:
        '200':
          description: Successful Public Data API response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicEventsOwnershipItem'
                required:
                - data
                additionalProperties: false
              example:
                data:
                - event_id: 105be55eb44776e37c92f3d13eedcd33829833a5
                  ticker: PLTR
                  market: US
                  event_class: ownership
                  event_type: stake_change
                  axis:
