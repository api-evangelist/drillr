openapi: 3.2.0
info:
  title: drillr Public Data Events API
  version: 2.0.0-spec.110
  description: 'REST endpoints over the same tables the drillr app runs on: fundamentals, filings, earnings, ownership, events, executives, analyst data and news for US, Japan and China equities.'
  termsOfService: https://drillr.ai/legal/terms
  contact:
    name: drillr developer support
    url: https://drillr.ai/docs
    email: support@lil-grebe.com
  license:
    name: drillr Terms of Service
    url: https://drillr.ai/legal/terms
  x-logo:
    url: https://drillr.ai/images/brand/logo_512_optimized.png
    altText: drillr
servers:
- url: https://gateway.drillr.ai
security:
- ApiKeyAuth: []
tags:
- name: Events
  description: 'Corporate events: financings, deals, executive changes, corporate actions, ownership (US only)'
paths:
  /api/v2/events:
    get:
      operationId: publicDataV2Events
      tags:
      - Events
      summary: Get the canonical company-event timeline
      description: 'Returns a company''s event timeline: financings, deals, executive changes, dividends and buybacks, ownership changes, bankruptcy and delisting. Each row contains shared fields such as the event date, classification and filing link. Type-specific fields such as deal terms are on the matching `/events-*` endpoint: choose it by `event_class`, query with the same `ticker` and `from` = `to` = `event_date`, then match on `event_id` (identical on both sides; typed endpoints do not accept an `event_id` parameter).


        Example request: `GET /api/v2/events?ticker=BA&event_class=capital&from=2026-08-01&to=2026-08-31`'
      security:
      - ApiKeyAuth: []
      x-credits: 0.02 cr per call
      x-refresh: intraday extraction plus Sunday 09:00 UTC canonical replay
      parameters:
      - name: ticker
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 10
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: event_class
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - capital
            - distribution
            - share_structure
            - transaction
            - agreement
            - governance
            - ownership
            - legal_regulatory
          minItems: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      responses:
        '200':
          description: Successful Public Data API response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicEventsItem'
                required:
                - data
                additionalProperties: false
              example:
                data:
                - event_id: 2ab01e9be7acdb60d1fa9fdb1a50d66099f571c6
                  ticker: BA
                  market: US
                  event_class: capital
                  event_type: debt_issuance
                  axis:
                    action: amend
                  source_category: 8-K:1.01
                  event_date: '2026-08-24'
                  title: 'Debt Issuance: 2023 Five-Year Credit Agreement'
                  stage: amended
                  event_group_id: 17f96e213777c218efe4
                  is_current: true
                  accession_number: 0001628280-26-059427
                  form_type: 8-K
                  filing_url: https://www.sec.gov/Archives/edgar/data/12927/000162828026059427/0001628280-26-059427.txt
                  filing_date: '2026-08-28'
        '400':
          description: Bad request (invalid or unsupported parameter)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDataError'
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDataError'
        '402':
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDataError'
        '404':
          description: Ticker not found, market not covered, or dataset not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDataError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDataError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDataError'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDataError'
  /api/v2/events-financings:
    get:
      operationId: publicDataV2EventsFinancings
      tags:
      - Events
      summary: Get financing events
      description: 'Returns a company''s financing events with their terms: equity issuances, debt issuances, convertible notes, guarantees and defaults, one row per event (`event_class = capital`), distinguished by `event_type`, with amount, interest rate, maturity, issue price and other terms in type-specific fields. Buybacks are not here; they belong to `/events-corporate-actions`.


        Example request: `GET /api/v2/events-financings?ticker=BA&event_type=debt_issuance&from=2026-08-01&to=2026-08-31`'
      security:
      - ApiKeyAuth: []
      x-credits: 0.02 cr per call
      x-refresh: intraday extraction plus Sunday 09:00 UTC canonical replay
      parameters:
      - name: ticker
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 10
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: event_type
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - equity_issuance
            - debt_issuance
            - convertible
            - guarantee
            - debt_default
          minItems: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      responses:
        '200':
          description: Successful Public Data API response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicEventsFinancingsItem'
                required:
                - data
                additionalProperties: false
              example:
                data:
                - event_id: 2ab01e9be7acdb60d1fa9fdb1a50d66099f571c6
                  ticker: BA
                  market: US
                  event_class: capital
                  event_type: debt_issuance
                  axis:
                    action: amend
                  source_category: 8-K:1.01
                  event_date: '2026-08-24'
                  title: 'Debt Issuance: 2023 Five-Year Credit Agreement'
                  stage: amended
                  event_group_id: 17f96e213777c218efe4
                  is_current: true
                  accession_number: 0001628280-26-059427
                  form_type: 8-K
                  filing_url: https://www.sec.gov/Archives/edgar/data/12927/000162828026059427/0001628280-26-059427.txt
                  filing_date: '2026-08-28'
