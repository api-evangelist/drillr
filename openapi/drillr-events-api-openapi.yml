        Example request: `GET /api/v2/events-executive-changes?event_type=executive_change&from=2026-03-01&to=2026-03-31`'
      security:
      - ApiKeyAuth: []
      x-credits: 0.02 cr per call
      x-refresh: intraday extraction plus Sunday 09:00 UTC canonical replay
      parameters:
      - name: ticker
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 10
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: event_type
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - executive_change
            - director_change
            - auditor_change
          minItems: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      - name: page
        in: query
        required: false
