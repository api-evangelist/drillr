  /api/v2/events-deals:
    get:
      operationId: publicDataV2EventsDeals
      tags:
      - Events
      summary: Get deal events
      description: 'Returns a company''s deals and agreements with counterparties: M&A, divestitures, joint ventures, licensing, material contracts and settlements, one row per deal (`event_class = transaction` or `agreement`), with the filing company as the subject: `direction` / `filer_role` state whether it is buyer or seller, licensor or licensee, and the counterparty is in `counterparty_names` / `counterparty_tickers`.


        Example request: `GET /api/v2/events-deals?ticker=MSFT&event_type=acquisition&from=2023-10-01&to=2023-10-31`'
      security:
      - ApiKeyAuth: []
      x-credits: 0.02 cr per call
      x-refresh: intraday extraction plus Sunday 09:00 UTC canonical replay
      parameters:
      - name: ticker
        in: query
        required: false
        style: form
