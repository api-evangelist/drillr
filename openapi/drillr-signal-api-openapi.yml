            - story_id
            - title
            - summary
            - node_count
            - first_seen_at
            - last_seen_at
            - created_at
            - sim
            - events_in_window
            - tags
            - events
            additionalProperties: false
        claims:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              time_event:
                type: string
                format: date-time
              claim_type:
                type: string
              claim_subtype:
                type:
                - string
                - 'null'
              claimant_name:
                type:
                - string
                - 'null'
              target_name:
                type:
                - string
                - 'null'
              summary:
                type: string
              sources_total:
                type: integer
              first_reported:
                type: string
                format: date-time
              last_reported:
                type: string
                format: date-time
              source:
                type: object
                properties:
                  name:
                    type: string
                  url:
                    type: string
                    format: uri
                  time:
                    type: string
                    format: date-time
                  headline:
                    type:
                    - string
                    - 'null'
                required:
                - name
                - url
                - time
                - headline
                additionalProperties: false
            required:
            - id
            - time_event
            - claim_type
            - claim_subtype
            - claimant_name
            - target_name
            - summary
            - sources_total
            - first_reported
            - last_reported
            - source
