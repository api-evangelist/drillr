                  - id
                  - time_event
                  - summary
                  - event_type
                  - event_subtype
                  - primary_entity_name
                  - object_name
                  - score
                  - sim
                  - sources_total
                  - first_reported
                  - last_reported
                  - source
                  additionalProperties: false
