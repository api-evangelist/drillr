                      type: string
                    event_type:
                      type: string
                    event_subtype:
                      type:
                      - string
                      - 'null'
                    primary_entity_name:
                      type:
                      - string
                      - 'null'
                    object_name:
                      type:
                      - string
                      - 'null'
                    score:
                      type: number
                    sim:
                      type: number
                    sources_total:
                      type: integer
